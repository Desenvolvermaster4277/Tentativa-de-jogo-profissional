<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b16">
  <meta name="description" content="Click Play - Plataforma de jogos online">
  <title>Click Play</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070a12;
      --bg2: #0d1120;
      --card: #111729;
      --card2: #151c30;
      --border: rgba(255,255,255,.08);
      --text: #f7f8ff;
      --muted: #8d96ad;
      --primary: #6c5ce7;
      --primary2: #8b7cf6;
      --success: #21c98b;
      --danger: #ff5571;
      --warning: #ffc857;
      --blue: #3ea6ff;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --radius: 18px;
    }

    body {
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 0%, rgba(108,92,231,.18), transparent 30%),
        radial-gradient(circle at 100% 20%, rgba(62,166,255,.12), transparent 25%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hidden {
      display: none !important;
    }

    .app {
      min-height: 100vh;
      display: flex;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 250px;
      background: rgba(8,11,22,.92);
      border-right: 1px solid var(--border);
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 22px 14px;
      backdrop-filter: blur(20px);
    }

    .logo {
      padding: 8px 12px 25px;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: -.7px;
    }

    .logo span {
      color: var(--primary2);
    }

    .nav-title {
      color: #626b82;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 12px;
    }

    .nav {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .nav button {
      color: var(--muted);
      background: transparent;
      border-radius: 12px;
      padding: 12px 13px;
      text-align: left;
      transition: .2s;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
    }

    .nav button:hover,
    .nav button.active {
      color: white;
      background: rgba(108,92,231,.16);
    }

    .nav-icon {
      width: 22px;
      text-align: center;
      font-size: 17px;
    }

    .sidebar-bottom {
      margin-top: auto;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      width: calc(100% - 250px);
      margin-left: 250px;
      min-height: 100vh;
    }

    .topbar {
      height: 72px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      background: rgba(7,10,18,.72);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .search {
      width: min(420px, 45vw);
      position: relative;
    }

    .search input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: white;
      padding: 11px 14px 11px 42px;
      outline: none;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 10px;
      opacity: .55;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      color: white;
    }

    .user-mini {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: linear-gradient(135deg,var(--primary),#25c5ff);
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    .content {
      padding: 30px;
      max-width: 1600px;
      margin: auto;
    }

    /* =========================
       CARDS
    ========================= */

    .card {
      background: linear-gradient(145deg, rgba(17,23,41,.98), rgba(13,17,32,.98));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 38px;
      min-height: 260px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 80% 20%, rgba(108,92,231,.4), transparent 30%),
        linear-gradient(135deg,#15182c,#11172b 60%,#0d1220);
    }

    .hero h1 {
      font-size: clamp(30px, 4vw, 52px);
      line-height: 1;
      max-width: 700px;
      margin-bottom: 15px;
    }

    .hero p {
      color: var(--muted);
      max-width: 620px;
      line-height: 1.6;
    }

    .hero-buttons {
      display: flex;
      gap: 10px;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 18px;
      border-radius: 12px;
      font-weight: 800;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      color: white;
      background: linear-gradient(135deg,var(--primary),var(--primary2));
    }

    .btn-secondary {
      color: white;
      background: var(--card2);
      border: 1px solid var(--border);
    }

    .btn-danger {
      color: white;
      background: var(--danger);
    }

    .section {
      margin-top: 28px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .section-header h2 {
      font-size: 21px;
    }

    .section-header span {
      color: var(--muted);
      font-size: 13px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill,minmax(230px,1fr));
      gap: 16px;
    }

    .game-card {
      overflow: hidden;
      cursor: pointer;
      transition: .2s;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: rgba(139,124,246,.4);
    }

    .game-cover {
      height: 145px;
      display: grid;
      place-items: center;
      font-size: 55px;
      background:
        radial-gradient(circle at 30% 20%, rgba(255,255,255,.18), transparent 30%),
        linear-gradient(135deg,#202849,#12172b);
    }

    .game-info {
      padding: 16px;
    }

    .game-info h3 {
      margin-bottom: 5px;
    }

    .game-info p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .tags {
      display: flex;
      gap: 6px;
      margin-top: 11px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 10px;
      padding: 5px 8px;
      border-radius: 20px;
      background: rgba(108,92,231,.12);
      color: #bcb4ff;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(4,1fr);
      gap: 14px;
    }

    .stat {
      padding: 20px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 900;
    }

    /* =========================
       TABLE
    ========================= */

    .table {
      width: 100%;
      border-collapse: collapse;
    }

    .table th,
    .table td {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    .table th {
      color: var(--muted);
      font-size: 12px;
    }

    .rank-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .small-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
    }

    /* =========================
       FORMS
    ========================= */

    .form-card {
      max-width: 650px;
      margin: auto;
      padding: 25px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #c9cee0;
      font-size: 13px;
      font-weight: 700;
    }

    .input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 11px;
      background: #0a0e1b;
      color: white;
      border: 1px solid var(--border);
      outline: none;
    }

    .input:focus {
      border-color: var(--primary);
    }

    /* =========================
       AUTH
    ========================= */

    .auth-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at 30% 20%, rgba(108,92,231,.25), transparent 35%),
        var(--bg);
    }

    .auth-box {
      width: min(440px,100%);
      padding: 30px;
    }

    .auth-logo {
      text-align: center;
      font-size: 35px;
      font-weight: 950;
      margin-bottom: 8px;
    }

    .auth-logo span {
      color: var(--primary2);
    }

    .auth-subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 25px;
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-bottom: 22px;
      background: #0a0e1a;
      padding: 4px;
      border-radius: 12px;
    }

    .auth-tabs button {
      padding: 10px;
      background: transparent;
      color: var(--muted);
      border-radius: 9px;
    }

    .auth-tabs button.active {
      background: var(--card2);
      color: white;
    }

    .error {
      color: #ff758b;
      font-size: 13px;
      margin: 10px 0;
    }

    .success {
      color: #3de0a0;
      font-size: 13px;
      margin: 10px 0;
    }

    /* =========================
       PROFILE
    ========================= */

    .profile-cover {
      height: 210px;
      border-radius: var(--radius) var(--radius) 0 0;
      background:
        radial-gradient(circle at 30% 20%, rgba(139,124,246,.4), transparent 25%),
        linear-gradient(135deg,#171c36,#0c1120);
      position: relative;
      overflow: hidden;
    }

    .profile-banner-upload {
      position: absolute;
      right: 18px;
      top: 18px;
    }

    .profile-main {
      padding: 0 25px 25px;
      position: relative;
    }

    .profile-big-avatar {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      border: 5px solid var(--bg2);
      object-fit: cover;
      margin-top: -50px;
      background: linear-gradient(135deg,var(--primary),#1ec8ff);
    }

    .profile-name {
      font-size: 26px;
      font-weight: 900;
      margin-top: 8px;
    }

    .profile-email {
      color: var(--muted);
      font-size: 13px;
    }

    .xp-bar {
      height: 8px;
      background: #080c17;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 10px;
    }

    .xp-fill {
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg,var(--primary),#39c9ff);
      border-radius: inherit;
    }

    /* =========================
       MILLION GAME
    ========================= */

    .million {
      max-width: 900px;
      margin: auto;
    }

    .million-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .pill {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 30px;
      font-size: 13px;
    }

    .question-card {
      padding: 25px;
      text-align: center;
    }

    .question-number {
      color: var(--primary2);
      font-weight: 800;
      margin-bottom: 15px;
    }

    .question-text {
      font-size: clamp(21px,3vw,31px);
      font-weight: 850;
      line-height: 1.3;
      margin-bottom: 25px;
    }

    .timer {
      height: 7px;
      background: #080b14;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 25px;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: var(--success);
      transition: width 1s linear;
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .answer {
      padding: 17px;
      border-radius: 13px;
      background: #0d1323;
      color: white;
      border: 1px solid var(--border);
      text-align: left;
      transition: .15s;
    }

    .answer:hover {
      border-color: var(--primary);
      background: #141a30;
    }

    .answer.correct {
      background: rgba(33,201,139,.18);
      border-color: var(--success);
    }

    .answer.wrong {
      background: rgba(255,85,113,.18);
      border-color: var(--danger);
    }

    .answer.disabled {
      opacity: .3;
      pointer-events: none;
    }

    .helps {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 17px;
    }

    .help {
      padding: 9px 12px;
      border-radius: 10px;
      background: var(--card2);
      color: white;
      border: 1px solid var(--border);
    }

    /* =========================
       SKY DASH
    ========================= */

    .sky-wrap {
      max-width: 800px;
      margin: auto;
    }

    .sky-board {
      height: 470px;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 70% 20%, rgba(255,255,255,.2), transparent 2%),
        radial-gradient(circle at 20% 35%, rgba(255,255,255,.2), transparent 2%),
        linear-gradient(#101b3b,#162f55 55%,#102437);
      border: 1px solid var(--border);
    }

    .bird {
      position: absolute;
      width: 34px;
      height: 28px;
      border-radius: 50% 55% 50% 40%;
      background: #ffc857;
      left: 110px;
      top: 200px;
      z-index: 5;
    }

    .bird:after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      background: #111;
      border-radius: 50%;
      right: 6px;
      top: 5px;
    }

    .pipe {
      position: absolute;
      width: 65px;
      background: #27c37b;
      border: 3px solid rgba(0,0,0,.18);
      z-index: 4;
    }

    .sky-score {
      position: absolute;
      top: 18px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 40px;
      font-weight: 950;
      z-index: 10;
      text-shadow: 0 4px 15px #000;
    }

    .sky-message {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 20;
      pointer-events: none;
      text-align: center;
    }

    .sky-message div {
      background: rgba(5,8,16,.78);
      padding: 25px;
      border-radius: 18px;
      pointer-events: auto;
    }

    /* =========================
       NOTIFICATIONS
    ========================= */

    .toast-container {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toast {
      width: min(360px, calc(100vw - 36px));
      background: #12182a;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 15px;
      border-radius: 13px;
      animation: slide .25s ease;
    }

    @keyframes slide {
      from { transform: translateY(15px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* =========================
       MOBILE
    ========================= */

    .mobile-menu {
      display: none;
    }

    @media(max-width:900px) {
      .sidebar {
        transform: translateX(-100%);
        transition: .25s;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main {
        width: 100%;
        margin-left: 0;
      }

      .mobile-menu {
        display: inline-grid;
        place-items: center;
      }

      .topbar {
        padding: 0 15px;
      }

      .search {
        width: 45%;
      }

      .content {
        padding: 18px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media(max-width:600px) {
      .topbar {
        gap: 8px;
      }

      .search {
        width: 100%;
      }

      .top-actions .user-mini span {
        display: none;
      }

      .hero {
        padding: 25px;
      }

      .answers {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
      }

      .table-wrap {
        overflow-x: auto;
      }

      .sky-board {
        height: 430px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       AUTH
  ========================= -->

  <section id="authScreen" class="auth-screen">
    <div class="auth-box card">

      <div class="auth-logo">
        Click <span>Play</span>
      </div>

      <div class="auth-subtitle">
        Sua plataforma de jogos online
      </div>

      <div class="auth-tabs">
        <button id="loginTab" class="active">Entrar</button>
        <button id="registerTab">Criar conta</button>
      </div>

      <form id="authForm">

        <div id="nameGroup" class="form-group hidden">
          <label>Nome de usuário</label>
          <input id="authName" class="input" type="text" maxlength="30" placeholder="Seu nome">
        </div>

        <div class="form-group">
          <label>E-mail</label>
          <input id="authEmail" class="input" type="email" required placeholder="seu@email.com">
        </div>

        <div class="form-group">
          <label>Senha</label>
          <input id="authPassword" class="input" type="password" minlength="6" required placeholder="••••••••">
        </div>

        <div id="authMessage"></div>

        <button id="authSubmit" class="btn btn-primary" style="width:100%;">
          Entrar
        </button>

      </form>
    </div>
  </section>


  <!-- =========================
       APP
  ========================= -->

  <div id="app" class="app hidden">

    <aside id="sidebar" class="sidebar">

      <div class="logo">
        Click <span>Play</span>
      </div>

      <div class="nav-title">Principal</div>

      <nav class="nav">

        <button data-page="home" class="active">
          <span class="nav-icon">⌂</span>
          Início
        </button>

        <button data-page="games">
          <span class="nav-icon">🎮</span>
          Jogos
        </button>

        <button data-page="ranking">
          <span class="nav-icon">🏆</span>
          Ranking
        </button>

        <button data-page="missions">
          <span class="nav-icon">🎯</span>
          Missões
        </button>

        <button data-page="achievements">
          <span class="nav-icon">🏅</span>
          Conquistas
        </button>

      </nav>

      <div class="nav-title">Social</div>

      <nav class="nav">

        <button data-page="friends">
          <span class="nav-icon">👥</span>
          Amigos
        </button>

        <button data-page="chat">
          <span class="nav-icon">💬</span>
          Chat
        </button>

        <button data-page="notifications">
          <span class="nav-icon">🔔</span>
          Notificações
        </button>

      </nav>

      <div class="nav-title">Conta</div>

      <nav class="nav">

        <button data-page="profile">
          <span class="nav-icon">👤</span>
          Perfil
        </button>

        <button data-page="history">
          <span class="nav-icon">📊</span>
          Histórico
        </button>

        <button data-page="settings">
          <span class="nav-icon">⚙️</span>
          Configurações
        </button>

      </nav>

      <div class="sidebar-bottom">
        <button id="logoutBtn" class="btn btn-secondary" style="width:100%;">
          Sair
        </button>
      </div>

    </aside>


    <main class="main">

      <header class="topbar">

        <button id="mobileMenu" class="icon-button mobile-menu">
          ☰
        </button>

        <div class="search">
          <span class="search-icon">⌕</span>
          <input id="globalSearch" placeholder="Buscar jogos, jogadores...">
        </div>

        <div class="top-actions">

          <button class="icon-button" onclick="navigate('notifications')">
            🔔
          </button>

          <div class="user-mini" onclick="navigate('profile')">
            <img id="topAvatar" class="avatar" alt="Avatar">
            <span id="topName">Jogador</span>
          </div>

        </div>

      </header>


      <div id="content" class="content"></div>

    </main>

  </div>


  <div id="toastContainer" class="toast-container"></div>


  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      updateDoc,
      collection,
      addDoc,
      getDocs,
      query,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp,
      increment
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    import {
      getStorage,
      ref,
      uploadBytes,
      getDownloadURL
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


    /* ==========================================================
       FIREBASE CONFIG DO CLICK PLAY

    function escapeHtml(value) {

        .replaceAll("&", "&amp;")

        .replaceAll("'", "&#039;");

      `)}`;

    function formatDate(timestamp) {

      if (!timestamp) return "Agora";

        const date = timestamp.toDate

      } catch {

    window.sendFriendRequest = async function() {

      const email =
        document.getElementById("friendEmail")
          .value.trim()
          .toLowerCase();

      if (!email) {

        toast("Digite o e-mail do jogador.");

        return;
      }

      if (email === currentUser.email.toLowerCase()) {

        toast("Você não pode adicionar a si mesmo.");

        return;
      }

      try {

        const usersQuery = query(
          collection(db,"users"),
          limit(100)
        );

        const snap = await getDocs(usersQuery);

        let target = null;

        snap.forEach(item => {

          if (
            String(item.data().email || "").toLowerCase() === email
          ) {
            target = {
              id:item.id,
              ...item.data()
            };
          }

        });

        if (!target) {

          toast("Jogador não encontrado.");

          return;
        }

        await addDoc(
          collection(db,"friend_requests"),
          {
            from: currentUser.uid,
            to: target.uid,
            fromName: currentProfile.name,
            fromEmail: currentUser.email,
            status:"pending",
            createdAt:serverTimestamp()
          }
        );

        await addDoc(
          collection(db,"notifications"),
          {
            userId:target.uid,
            type:"friend_request",
            title:"Nova solicitação de amizade",
            message:`${currentProfile.name} quer ser seu amigo.`,
            read:false,
            createdAt:serverTimestamp()
          }
        );

        toast("Solicitação enviada.");

        document.getElementById("friendEmail").value = "";

      } catch(error) {

        console.error(error);

        toast("Não foi possível enviar a solicitação.");
      }
    };


    async function loadFriends() {

      const element =
        document.getElementById("friendsList");

      if (!element) return;

      try {

        const friendsQuery = query(
          collection(db,"friends"),
          limit(100)
        );

        const snap = await getDocs(friendsQuery);

        const friends = [];

        snap.forEach(item => {

          const data = item.data();

          if (
            data.user1 === currentUser.uid ||
            data.user2 === currentUser.uid
          ) {
            friends.push(data);
          }

        });

        if (!friends.length) {

          element.innerHTML =
            "Você ainda não adicionou amigos.";

          return;
        }

        element.innerHTML = friends.map(friend => `

          <div style="
            padding:12px 0;
            border-bottom:1px solid var(--border);
          ">

            <strong>
              Amigo
            </strong>

          </div>

        `).join("");

      } catch {

        element.innerHTML =
          "Sua lista de amigos aparecerá aqui.";
      }
    }

    window.sendChatMessage = async function() {

      const input =
        document.getElementById("chatInput");

      const message =
        input.value.trim();

      if (!message) return;

      try {

        await addDoc(
          collection(db,"private_messages"),
          {
            senderId:currentUser.uid,
            senderName:currentProfile.name,
            text:message,
            createdAt:serverTimestamp()
          }

    async function loadNotifications() {

      const element =
        document.getElementById("notificationList");

      if (!element) return;

      try {

        const notificationsQuery = query(
          collection(db,"notifications"),
          limit(50)
        );

        const snap =
          await getDocs(notificationsQuery);

        const list = [];

        snap.forEach(item => {

          const data = item.data();

          if (data.userId === currentUser.uid) {

            list.push(data);
          }

        });

        list.sort((a,b) => {

          const aa =
            a.createdAt?.seconds || 0;

          const bb =
            b.createdAt?.seconds || 0;

          return bb - aa;
        });

        if (!list.length) {

          element.innerHTML =
            `<div style="color:#8d96ad;">
              Nenhuma notificação.
            </div>`;

          return;
        }

        element.innerHTML = list.map(item => `

          <div style="
            padding:15px 0;
            border-bottom:1px solid var(--border);
          ">

            <strong>
              ${escapeHtml(item.title || "Notificação")}
            </strong>

            <div style="
              color:#8d96ad;
              margin-top:5px;
              font-size:13px;
            ">
              ${escapeHtml(item.message || "")}
            </div>

          </div>

        `).join("");

      } catch {

        element.innerHTML =
          "Nenhuma notificação encontrada.";
      }
    }

    window.startMillion = function() {

      millionGame.active = true;
      millionGame.questionIndex = 0;

    function showMillionQuestion() {

      if (!millionGame.active) return;

      if (
        millionGame.questionIndex >=
        Math.min(millionGame.questions.length,10)
      ) {

        finishMillion(true);

        return;
      }

      const question =
        millionGame.questions[millionGame.questionIndex];

      const shuffled =
        shuffleAnswers(question);

      question.displayAnswers = shuffled.answers;
      question.displayCorrect = shuffled.correct;

      millionGame.answered = false;

      const area =
        document.getElementById("millionArea");

      area.innerHTML = `

        <div class="card question-card">

          <div class="question-number">

      updateMillionHeader();

    function shuffle(array) {

      for (
        let i = array.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(Math.random() * (i + 1));

        [array[i],array[j]] =
          [array[j],array[i]];
      }

      return array;
    }


    function shuffleAnswers(question) {

      const original =
        question.answers.map((answer,index) => ({
          answer,
          index
        }));

      shuffle(original);

      return {

        answers:
          original.map(item => item.answer),

        correct:
          original.findIndex(
            item => item.index === question.correct
          )

      };
    }


    window.answerMillion = function(index) {

      if (millionGame.answered) return;

      millionGame.answered = true;

      clearInterval(millionGame.timerInterval);

      const question =
        millionGame.questions[
          millionGame.questionIndex
        ];

      const buttons =
        document.querySelectorAll(".answer");

      buttons.forEach(button => {

        button.disabled = true;

        if (
          Number(button.dataset.answer) ===
          question.displayCorrect
        ) {
          button.classList.add("correct");
        }

      });


      if (index === question.displayCorrect) {

        buttons[index].classList.add("correct");

        const difficulty =
          question.difficulty || 1;

        const points =
          100 * difficulty *
          (millionGame.questionIndex + 1);

        millionGame.score += points;

        addXP(20 + difficulty * 5);

        toast(`Resposta correta! +${points} pontos`);

        setTimeout(() => {

          millionGame.questionIndex++;

          showMillionQuestion();

        },1000);

      } else {

        buttons[index].classList.add("wrong");

        millionGame.lives--;

        updateMillionHeader();

        toast("Resposta errada!");

        if (millionGame.lives <= 0) {

          setTimeout(() => {
            finishMillion(false);
          },1000);

        } else {

          setTimeout(() => {

            millionGame.questionIndex++;

            showMillionQuestion();

          },1000);

        }

      }

    };


    function startMillionTimer() {

      clearInterval(millionGame.timerInterval);

      millionGame.timer = 20;

      const timer =
        document.getElementById("millionTimer");

      if (!timer) return;

      timer.style.width = "100%";

      millionGame.timerInterval =
        setInterval(() => {

          millionGame.timer--;

          timer.style.width =
            `${Math.max(
              0,
              millionGame.timer / 20 * 100
            )}%`;

          if (millionGame.timer <= 0) {

            clearInterval(
              millionGame.timerInterval
            );

            if (!millionGame.answered) {

              millionGame.answered = true;

              millionGame.lives--;

              updateMillionHeader();

              toast("Tempo esgotado!");

              if (millionGame.lives <= 0) {

                finishMillion(false);

              } else {

                setTimeout(() => {

                  millionGame.questionIndex++;

                  showMillionQuestion();

                },800);

              }

            }

          }

        },1000);
    }

    window.millionFifty = function() {

    async function addXP(amount) {

      if (!currentUser || !currentProfile) return;

      const oldXP =
        currentProfile.xp || 0;

      const newXP =
        oldXP + amount;

      const newLevel =
        Math.floor(newXP / 100) + 1;

      try {

        await updateDoc(
          doc(db,"users",currentUser.uid),
          {
            xp:increment(amount),
            level:newLevel,
            updatedAt:serverTimestamp()
          }
        );

        currentProfile.xp = newXP;
        currentProfile.level = newLevel;

        updateTopUser();

      } catch(error) {

        console.error(error);
      }
    }


    async function saveGameResult(
      game,
      score,
      won
    ) {

      if (!currentUser) return;

      try {

        await addDoc(
          collection(db,"game_sessions"),
          {
            userId:currentUser.uid,
            userName:currentProfile.name,
            game,
            score,
            won,
            createdAt:serverTimestamp()
          }
        );


        await updateDoc(
          doc(db,"users",currentUser.uid),
          {
            gamesPlayed:increment(1),

            wins:
              won
                ? increment(1)
                : increment(0),

            losses:
              won
                ? increment(0)
                : increment(1),

            totalScore:
              increment(score),

            updatedAt:
              serverTimestamp()
          }
        );


        currentProfile.gamesPlayed =
          (currentProfile.gamesPlayed || 0) + 1;

        if (won) {

          currentProfile.wins =
            (currentProfile.wins || 0) + 1;

        } else {

          currentProfile.losses =
            (currentProfile.losses || 0) + 1;
        }

        currentProfile.totalScore =
          (currentProfile.totalScore || 0) + score;

      } catch(error) {

        console.error(error);
      }
    }


    /* ==========================================================
       SKY DASH
    ========================================================== */

    function renderSky(content) {

      content.innerHTML = `

        <div class="sky-wrap">

          <div class="million-top">

            <button
              class="btn btn-secondary"
              onclick="stopSky()">
              ← Voltar
            </button>

            <div style="display:flex;gap:8px;">

              <span class="pill">
                🏆 Recorde:
                <span id="skyBest">
                  ${currentProfile.skyBest || 0}
                </span>
              </span>

            </div>

          </div>


          <div class="card" style="padding:12px;">

            <div id="skyBoard" class="sky-board">

              <div id="skyScore"
                class="sky-score">
                0
              </div>

              <div id="skyBird"
                class="bird">
              </div>

              <div id="skyPipes"></div>

              <div id="skyMessage"
                class="sky-message">

                <div>

                  <div style="font-size:50px;">
                    🪽
                  </div>

                  <h2>
                    Sky Dash
                  </h2>

                  <p style="
                    color:#8d96ad;
                    margin-top:7px;
                  ">
                    Clique, toque ou pressione espaço
                    para voar.
                  </p>

                  <button
                    class="btn btn-primary"
                    style="margin-top:15px;"
                    onclick="startSky()">
                    Começar
                  </button>

                </div>

              </div>

            </div>

          </div>

        </div>
      `;


      const board =
        document.getElementById("skyBoard");

      board.addEventListener(
        "pointerdown",
        skyJump
      );


      document.onkeydown = event => {

        if (
          event.code === "Space" ||
          event.code === "ArrowUp"
        ) {

          event.preventDefault();

          skyJump();
        }

      };
    }


    window.startSky = function() {

      cancelAnimationFrame(
        skyGame.frame
      );

      skyGame.active = true;
      skyGame.score = 0;
      skyGame.birdY = 200;
      skyGame.velocity = 0;
      skyGame.pipes = [];
      skyGame.started = true;
      skyGame.gameOver = false;

      document.getElementById("skyMessage")
        .innerHTML = "";

      document.getElementById("skyPipes")
        .innerHTML = "";

      createSkyPipe(500);

      skyLoop();
    };


    function skyJump() {

      if (!skyGame.active) {

        if (!skyGame.started) {

          startSky();

        }

        return;
      }

      skyGame.velocity =
        skyGame.jump;
    }


    function createSkyPipe(x) {

      const board =
        document.getElementById("skyBoard");

      if (!board) return;

      const gap = 145;

      const minTop = 45;

      const maxTop =
        board.clientHeight - gap - 90;

      const top =
        minTop +
        Math.random() *
        Math.max(1,maxTop-minTop);

      const pipe = {

        x,

        top,

        gap,

        passed:false

      };

      skyGame.pipes.push(pipe);

      const container =
        document.getElementById("skyPipes");

      const topEl =
        document.createElement("div");

      topEl.className = "pipe";

      topEl.dataset.pipe = x;

      topEl.style.left = `${x}px`;

      topEl.style.top = "0";

      topEl.style.height = `${top}px`;

      const bottomEl =
        document.createElement("div");

      bottomEl.className = "pipe";

      bottomEl.dataset.pipe = x;

      bottomEl.style.left = `${x}px`;

      bottomEl.style.bottom = "0";

      bottomEl.style.height =
        `${board.clientHeight - top - gap}px`;

      container.appendChild(topEl);
      container.appendChild(bottomEl);
    }


    function skyLoop() {

      if (!skyGame.active) return;

      const board =
        document.getElementById("skyBoard");

      const bird =
        document.getElementById("skyBird");

      const pipesContainer =
        document.getElementById("skyPipes");

      if (!board || !bird) return;

      skyGame.velocity +=
        skyGame.gravity;

      skyGame.birdY +=
        skyGame.velocity;

      bird.style.top =
        `${skyGame.birdY}px`;


      skyGame.pipes.forEach(pipe => {

        pipe.x -= 2.7;

        const elements =
          [...pipesContainer.children]
            .filter(
              element =>
                Number(element.dataset.pipe) ===
                pipe.x + 2.7
            );

        elements.forEach(element => {

          element.style.left =
            `${pipe.x}px`;

        });


        if (
          !pipe.passed &&
          pipe.x + 65 < 110
        ) {

          pipe.passed = true;

          skyGame.score++;

          document.getElementById("skyScore")
            .textContent =
            skyGame.score;
        }

      });


      if (
        skyGame.pipes.length === 0 ||
        skyGame.pipes[
          skyGame.pipes.length - 1
        ].x < board.clientWidth - 220
      ) {

        createSkyPipe(
          board.clientWidth + 30
        );
      }


      while (
        skyGame.pipes.length &&
        skyGame.pipes[0].x < -100
      ) {

        skyGame.pipes.shift();

        if (pipesContainer.children.length >= 2) {

          pipesContainer.removeChild(
            pipesContainer.children[0]
          );

          pipesContainer.removeChild(
            pipesContainer.children[0]
          );
        }
      }


      const birdX = 110;
      const birdW = 34;
      const birdH = 28;

      const collision =
        skyGame.pipes.some(pipe => {

          const horizontal =
            birdX + birdW > pipe.x &&
            birdX < pipe.x + 65;

          if (!horizontal) return false;

          const insideGap =
            skyGame.birdY > pipe.top &&
            skyGame.birdY + birdH <
              pipe.top + pipe.gap;

          return !insideGap;
        });


      if (
        collision ||
        skyGame.birdY < 0 ||
        skyGame.birdY >
          board.clientHeight - birdH
      ) {

        endSky();

        return;
      }


      skyGame.frame =
        requestAnimationFrame(skyLoop);
    }


    async function endSky() {

      if (!skyGame.active) return;

      skyGame.active = false;

      cancelAnimationFrame(
        skyGame.frame
      );

      const score =
        skyGame.score;

      const oldBest =
        currentProfile.skyBest || 0;

      const newBest =
        Math.max(oldBest,score);

      if (newBest > oldBest) {

        currentProfile.skyBest = newBest;

        try {

          await updateDoc(
            doc(db,"users",currentUser.uid),
            {
              skyBest:newBest,
              updatedAt:serverTimestamp()
            }
          );

        } catch(error) {

          console.error(error);
        }
      }

      await saveGameResult(
        "Sky Dash",
        score,
        score > 0
      );

      await addXP(
        10 + score * 2
      );


      const message =
        document.getElementById("skyMessage");

      if (!message) return;

      message.innerHTML = `

        <div>

          <div style="font-size:50px;">
            ${score > 10 ? "🏆" : "💥"}
          </div>

          <h2>
            Fim de jogo
          </h2>

          <p style="
            color:#8d96ad;
            margin-top:7px;
          ">
            Pontuação:
            <strong style="color:white;">
              ${score}
            </strong>
          </p>

          <p style="
            color:#8d96ad;
            margin-top:5px;
          ">
            Recorde:
            <strong style="color:white;">
              ${newBest}
            </strong>
          </p>

          <button
            class="btn btn-primary"
            style="margin-top:15px;"
            onclick="startSky()">
            Jogar novamente
          </button>

        </div>
      `;
    }


    window.stopSky = function() {

      skyGame.active = false;

      cancelAnimationFrame(
        skyGame.frame
      );

      document.onkeydown = null;

      navigate("games");
    };


    /* ==========================================================
       INICIALIZAÇÃO
    ========================================================== */

    window.addEventListener("beforeunload", () => {

      clearInterval(
        millionGame.timerInterval
      );

      cancelAnimationFrame(
        skyGame.frame
      );
    });

  </script>

</body>
